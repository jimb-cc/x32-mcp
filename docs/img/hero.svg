<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="A live sound rig: stage microphones feed an SD16 stagebox, which connects over AES50 to an X32 Rack mixer, which drives the PA speakers and stage wedges. Alongside, a Windows PC runs the x32-mcp server, which talks to the mixer over OSC on UDP port 10023 and is driven by Claude over MCP.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/><stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <style>
    .t   { font-family: "Segoe UI", Inter, system-ui, sans-serif; fill: #1e293b; }
    .lbl { font-size: 17px; font-weight: 600; }
    .sub { font-size: 13px; fill: #64748b; }
    .tag { font-size: 12px; fill: #5b6b7f; font-weight: 600; letter-spacing: .04em; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .wire{ stroke: #5b6b7f; stroke-width: 2; fill: none; }
    .osc { stroke: #c2410c; stroke-width: 2.5; fill: none; }
    .ttl { font-size: 26px; font-weight: 700; }
  </style>

  <rect width="1200" height="400" rx="14" fill="url(#bg)"/>

  <!-- ── stage ───────────────────────────────────────────── -->
  <text class="t tag" x="52" y="46">ON STAGE</text>
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <!-- three mic stands -->
    <g transform="translate(70,95)">
      <ellipse cx="0" cy="88" rx="17" ry="5" fill="#cbd5e1" stroke="none"/>
      <line x1="0" y1="88" x2="0" y2="20"/><line x1="0" y1="20" x2="16" y2="12"/>
      <rect x="14" y="2" width="9" height="16" rx="4.5" fill="#475569" stroke="none"/>
    </g>
    <g transform="translate(132,110)">
      <ellipse cx="0" cy="73" rx="15" ry="4.5" fill="#cbd5e1" stroke="none"/>
      <line x1="0" y1="73" x2="0" y2="16"/><line x1="0" y1="16" x2="14" y2="9"/>
      <rect x="12" y="0" width="8" height="14" rx="4" fill="#475569" stroke="none"/>
    </g>
    <g transform="translate(192,102)">
      <ellipse cx="0" cy="81" rx="16" ry="5" fill="#cbd5e1" stroke="none"/>
      <line x1="0" y1="81" x2="0" y2="18"/><line x1="0" y1="18" x2="15" y2="10"/>
      <rect x="13" y="1" width="9" height="15" rx="4.5" fill="#475569" stroke="none"/>
    </g>
  </g>
  <!-- wedge monitor -->
  <g transform="translate(60,236)">
    <path d="M0 54 L0 16 L74 0 L74 46 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="38" cy="29" rx="15" ry="13" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <ellipse cx="38" cy="29" rx="5" ry="4.5" fill="#94a3b8"/>
  </g>
  <text class="t sub" x="52" y="316">mics + wedge</text>
  <text class="t sub" x="52" y="334">(the feedback loop</text>
  <text class="t sub" x="52" y="350">CFS² listens for)</text>

  <!-- ── SD16 stagebox ───────────────────────────────────── -->
  <g transform="translate(250,150)">
    <rect class="box" width="118" height="72" rx="7"/>
    <g fill="#94a3b8">
      <circle cx="18" cy="24" r="5"/><circle cx="38" cy="24" r="5"/><circle cx="58" cy="24" r="5"/><circle cx="78" cy="24" r="5"/><circle cx="98" cy="24" r="5"/>
      <circle cx="18" cy="48" r="5"/><circle cx="38" cy="48" r="5"/><circle cx="58" cy="48" r="5"/><circle cx="78" cy="48" r="5"/><circle cx="98" cy="48" r="5"/>
    </g>
  </g>
  <text class="t lbl" x="250" y="243">SD16</text>
  <text class="t sub" x="250" y="262">stagebox · 16 preamps</text>

  <line class="wire" x1="216" y1="186" x2="244" y2="186" marker-end="url(#ar)"/>
  <line class="wire" x1="372" y1="186" x2="438" y2="186" marker-end="url(#ar)"/>
  <text class="t tag" x="376" y="176">AES50</text>

  <!-- ── X32 Rack ────────────────────────────────────────── -->
  <g transform="translate(444,132)">
    <rect class="box" width="268" height="108" rx="8"/>
    <!-- rack ears -->
    <rect x="-13" y="14" width="13" height="80" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="268" y="14" width="13" height="80" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="-6.5" cy="30" r="2.6" fill="#94a3b8"/><circle cx="-6.5" cy="78" r="2.6" fill="#94a3b8"/>
    <circle cx="274.5" cy="30" r="2.6" fill="#94a3b8"/><circle cx="274.5" cy="78" r="2.6" fill="#94a3b8"/>
    <!-- LCD -->
    <rect x="18" y="20" width="96" height="60" rx="4" fill="#1e293b"/>
    <g fill="#38bdf8">
      <rect x="27" y="58" width="7" height="14" rx="1.5"/><rect x="38" y="48" width="7" height="24" rx="1.5"/>
      <rect x="49" y="38" width="7" height="34" rx="1.5"/><rect x="60" y="52" width="7" height="20" rx="1.5"/>
      <rect x="71" y="44" width="7" height="28" rx="1.5"/><rect x="82" y="60" width="7" height="12" rx="1.5"/>
      <rect x="93" y="50" width="7" height="22" rx="1.5"/>
    </g>
    <text x="27" y="36" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#7dd3fc">RTA</text>
    <!-- encoders -->
    <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4">
      <circle cx="140" cy="38" r="13"/><circle cx="176" cy="38" r="13"/><circle cx="212" cy="38" r="13"/><circle cx="248" cy="38" r="13"/>
      <circle cx="140" cy="76" r="13"/><circle cx="176" cy="76" r="13"/><circle cx="212" cy="76" r="13"/><circle cx="248" cy="76" r="13"/>
    </g>
    <g stroke="#475569" stroke-width="2" stroke-linecap="round">
      <line x1="140" y1="38" x2="140" y2="29"/><line x1="176" y1="38" x2="183" y2="31"/>
      <line x1="212" y1="38" x2="205" y2="31"/><line x1="248" y1="38" x2="248" y2="29"/>
      <line x1="140" y1="76" x2="147" y2="69"/><line x1="176" y1="76" x2="176" y2="67"/>
      <line x1="212" y1="76" x2="219" y2="69"/><line x1="248" y1="76" x2="241" y2="69"/>
    </g>
  </g>
  <text class="t lbl" x="444" y="264">X32 Rack</text>
  <text class="t sub" x="444" y="283">32-channel digital mixer · no faders</text>
  <text class="t sub" x="444" y="300">every parameter addressable over the network</text>

  <!-- ── PA ──────────────────────────────────────────────── -->
  <line class="wire" x1="730" y1="186" x2="792" y2="186" marker-end="url(#ar)"/>
  <g transform="translate(800,120)">
    <rect class="box" width="76" height="130" rx="7"/>
    <ellipse cx="38" cy="44" rx="23" ry="21" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/>
    <ellipse cx="38" cy="44" rx="8" ry="7" fill="#94a3b8"/>
    <ellipse cx="38" cy="98" rx="14" ry="13" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/>
  </g>
  <text class="t lbl" x="800" y="273">PA</text>
  <text class="t sub" x="800" y="292">what the audience hears</text>

  <!-- ── the software side ───────────────────────────────── -->
  <g transform="translate(934,96)">
    <rect class="box" width="222" height="86" rx="9"/>
    <text class="t lbl" x="18" y="34">x32-mcp</text>
    <text class="t sub" x="18" y="55">MCP server · Python</text>
    <text class="t sub" x="18" y="72">policy · descriptor · CFS²</text>
  </g>
  <g transform="translate(934,232)">
    <rect class="box" width="222" height="76" rx="9"/>
    <text class="t lbl" x="18" y="32">Claude</text>
    <text class="t sub" x="18" y="53">“pull the vocal down 2 dB”</text>
  </g>
  <line class="wire" x1="1045" y1="232" x2="1045" y2="188" marker-end="url(#ar)"/>
  <text class="t tag" x="1052" y="214">MCP</text>

  <!-- OSC link, routed under the PA back to the desk -->
  <path class="osc" d="M934 139 L900 139 L900 330 L578 330 L578 246" marker-end="url(#arB)"/>
  <text class="t tag" x="640" y="323" fill="#c2410c">OSC over UDP :10023</text>

  <!-- title -->
  <text class="t ttl" x="52" y="384">x32-mcp</text>
  <text class="t sub" x="168" y="384" font-size="15">— conversational control of a live mixing console, under a safety policy enforced in code</text>
</svg>
