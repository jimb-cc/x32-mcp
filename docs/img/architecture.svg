<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" role="img" aria-label="Layered architecture: Claude talks MCP over stdio to the x32-mcp server. Inside, the tool layer delegates to a policy layer, then a desk facade, then a connection layer that speaks OSC over UDP to the console. A device descriptor (device.yaml) feeds every layer. CFS2 runs as a background task beside them.">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    .t { font-family: "Segoe UI", Inter, system-ui, sans-serif; fill: #1e293b; }
    .h { font-size: 16px; font-weight: 700; }
    .d { font-size: 12.5px; fill: #64748b; }
    .m { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #475569; }
    .tag { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; fill: #5b6b7f; }
    .layer { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .wire { stroke: #5b6b7f; stroke-width: 2; fill: none; }
  </style>
  <rect width="1060" height="470" rx="14" fill="#f7f8fa"/>

  <!-- Claude -->
  <g transform="translate(40,30)">
    <rect class="layer" width="300" height="62" rx="9" fill="#fff7ed" stroke="#fdba74"/>
    <text class="t h" x="18" y="27">Claude</text>
    <text class="t d" x="18" y="47">Desktop, Claude Code, or a phone</text>
  </g>
  <line class="wire" x1="190" y1="92" x2="190" y2="126" marker-end="url(#a2)"/>
  <text class="t tag" x="200" y="114">MCP · stdio</text>

  <!-- server stack -->
  <rect x="24" y="126" width="620" height="300" rx="12" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t tag" x="42" y="150">x32-mcp SERVER  ·  PYTHON 3.12  ·  ONE PROCESS</text>

  <g transform="translate(42,162)">
    <rect class="layer" width="584" height="56" rx="8"/>
    <text class="t h" x="16" y="25">tool layer</text>
    <text class="t d" x="16" y="43">63 MCP tools · engineering units in, JSON envelopes out · thin, delegates everything</text>
    <text class="t m" x="470" y="25">server.py</text>
  </g>
  <line class="wire" x1="334" y1="218" x2="334" y2="230" marker-end="url(#a2)"/>

  <g transform="translate(42,230)">
    <rect class="layer" width="584" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text class="t h" x="16" y="25">policy layer  <tspan font-size="12.5" font-weight="600" fill="#b91c1c">— the guardrail. every write passes through here.</tspan></text>
    <text class="t d" x="16" y="43">tiers · clamps · ramps · confirmation tokens · rate limit · show mode</text>
    <text class="t m" x="470" y="25">policy.py</text>
  </g>
  <line class="wire" x1="334" y1="286" x2="334" y2="298" marker-end="url(#a2)"/>

  <g transform="translate(42,298)">
    <rect class="layer" width="584" height="56" rx="8"/>
    <text class="t h" x="16" y="25">desk facade</text>
    <text class="t d" x="16" y="43">typed reads/writes in dB, Hz, ms · mute inversion lives here · node cache</text>
    <text class="t m" x="470" y="25">desk.py</text>
  </g>
  <line class="wire" x1="334" y1="354" x2="334" y2="366" marker-end="url(#a2)"/>

  <g transform="translate(42,366)">
    <rect class="layer" width="584" height="46" rx="8"/>
    <text class="t h" x="16" y="22">device layer</text>
    <text class="t d" x="16" y="38">one UDP socket · /xremote heartbeat · request/reply matching · reconnect backoff</text>
    <text class="t m" x="430" y="22">connection.py · osc.py</text>
  </g>

  <!-- descriptor -->
  <g transform="translate(676,162)">
    <rect class="layer" width="344" height="192" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
    <text class="t h" x="18" y="28">descriptor</text>
    <text class="t m" x="18" y="48">device.yaml</text>
    <text class="t d" x="18" y="74">All device knowledge lives here, not in code:</text>
    <text class="t d" x="18" y="94">· 491 parameters, 2103 node paths</text>
    <text class="t d" x="18" y="112">· scales (fader taper, log freq, enums)</text>
    <text class="t d" x="18" y="130">· safety tier + clamp per parameter</text>
    <text class="t d" x="18" y="148">· detector + ring-out thresholds</text>
    <text class="t d" x="18" y="172" font-style="italic">The Python is a generic OSC engine.</text>
  </g>
  <g stroke="#0f766e" stroke-width="1.6" fill="none">
    <path d="M676 196 L650 196 L650 190" marker-end="url(#a3)"/>
    <path d="M676 258 L650 258" marker-end="url(#a3)"/>
    <path d="M676 320 L650 320" marker-end="url(#a3)"/>
    <path d="M676 300 L650 300 L650 388" marker-end="url(#a3)"/>
  </g>

  <!-- CFS2 -->
  <g transform="translate(676,366)">
    <rect class="layer" width="344" height="60" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="t h" x="18" y="26">CFS² background task</text>
    <text class="t d" x="18" y="45">RTA in → detect → notch. Never round-trips the model.</text>
  </g>

  <!-- to the desk -->
  <line class="wire" x1="334" y1="426" x2="334" y2="452" marker-end="url(#a2)"/>
  <text class="t tag" x="346" y="446" fill="#c2410c">OSC / UDP :10023  →  X32 Rack</text>
</svg>
