<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" role="img" aria-label="Three safety tiers. Tier 0 read is always allowed. Tier 1 mix moves are clamped, ramped and rate limited. Tier 2 guarded actions need a single-use confirmation token approved by a human. Panic is deliberately Tier 1 so it can never be blocked.">
  <style>
    .t { font-family: "Segoe UI", Inter, system-ui, sans-serif; fill: #1e293b; }
    .h { font-size: 17px; font-weight: 700; }
    .n { font-size: 13px; fill: #475569; }
    .d { font-size: 12.5px; fill: #64748b; }
    .m { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .tag { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; }
  </style>
  <rect width="1060" height="430" rx="14" fill="#f7f8fa"/>
  <text class="t h" x="36" y="40">Safety model — enforced in code, not by prompting</text>
  <text class="t d" x="36" y="62">The server is the guardrail, so it holds even if the model misbehaves. A jailbroken prompt cannot widen these limits.</text>

  <!-- Tier 0 -->
  <g transform="translate(36,86)">
    <rect width="320" height="150" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text class="t tag" x="18" y="28" fill="#15803d">TIER 0 · READ</text>
    <text class="t h" x="18" y="52">Always allowed</text>
    <text class="t n" x="18" y="76">Channel state, EQ, sends, meters,</text>
    <text class="t n" x="18" y="94">scene list, full desk dump.</text>
    <text class="t d" x="18" y="120">No side effects. Nothing to gate.</text>
  </g>

  <!-- Tier 1 -->
  <g transform="translate(370,86)">
    <rect width="320" height="150" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text class="t tag" x="18" y="28" fill="#b45309">TIER 1 · MIX MOVES</text>
    <text class="t h" x="18" y="52">Allowed, but shaped</text>
    <text class="t n" x="18" y="76">Faders, sends, mutes, EQ, pan.</text>
    <text class="t d" x="18" y="98">· clamped to a ceiling (ch +5 dB, sends 0 dB)</text>
    <text class="t d" x="18" y="116">· ramped, not stepped (default 300 ms)</text>
    <text class="t d" x="18" y="134">· ±6 dB per relative call · 50 writes/s budget</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(704,86)">
    <rect width="320" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text class="t tag" x="18" y="28" fill="#b91c1c">TIER 2 · GUARDED</text>
    <text class="t h" x="18" y="52">Needs a human yes</text>
    <text class="t n" x="18" y="76">Mains, scene recall/save, routing,</text>
    <text class="t n" x="18" y="94">phantom power, snapshot restore.</text>
    <text class="t d" x="18" y="120">Two-step: the tool refuses and returns a token.</text>
  </g>

  <!-- the dance -->
  <g transform="translate(36,256)">
    <rect width="654" height="136" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="t tag" x="18" y="26" fill="#5b6b7f">THE CONFIRMATION DANCE</text>
    <text class="t m" x="18" y="52" fill="#475569">1.  set_main_fader("st", −15)</text>
    <text class="t d" x="300" y="52">→ refused, returns a token + a plain-English summary</text>
    <text class="t m" x="18" y="76" fill="#b91c1c">    “Set Main LR fader from −22.8 dB to −15.0 dB (4000 ms ramp)”</text>
    <text class="t m" x="18" y="100" fill="#475569">2.  … same call + confirm_token</text>
    <text class="t d" x="300" y="100">→ executes</text>
    <text class="t d" x="18" y="122">Single use · 5 minute TTL · bound to that one action — a token for a fader will not authorise a restore.</text>
  </g>

  <!-- panic -->
  <g transform="translate(704,256)">
    <rect width="320" height="136" rx="10" fill="#1e293b"/>
    <text class="t tag" x="18" y="28" fill="#fca5a5">THE EXCEPTION</text>
    <text class="h t" x="18" y="54" fill="#f8fafc" font-size="17">panic() is Tier 1</text>
    <text class="t d" x="18" y="78" fill="#cbd5e1">Mutes all 24 outputs. Bypasses the rate</text>
    <text class="t d" x="18" y="96" fill="#cbd5e1">limit and show mode by design — the one</text>
    <text class="t d" x="18" y="114" fill="#cbd5e1">action that must never be blocked.</text>
    <text class="t m" x="212" y="54" fill="#86efac">0.4 ms</text>
  </g>
</svg>
