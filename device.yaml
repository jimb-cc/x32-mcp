  # is UNCONFIRMED on a real desk; the DOC's node list names the leaf "-show/prepos/current" and the emulator
  # answers it ("/-show/prepos/current 0", transport.md §6.4 item 12) -> sweep the leaf (DESIGN §7 wrote
  # "/-show/prepos"; deviation recorded). The show line carries a trailing firmware string ("2.08") after
  # `effects` — extra tokens are ignored by the positional parser.
  - {family: show, path: "/-show/prepos/current", fields: [prepos/current]}
