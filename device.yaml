# x32-mcp device descriptor — Behringer X32 / M32 family, OSC over UDP 10023.
#
# This file is the ONLY place device knowledge lives (DESIGN.md §7). Every number in here traces to
# docs/research/*.md (Maillot's C sources + the protocol PDF + a real-console scene file). Where a value
# is surprising the comment cites the research section. Loaded by src/x32mcp/descriptor.py with
# yaml.safe_load; YAML merge keys (<<) and anchors are used to share the strip parameter blocks.
#
# CONVENTIONS
#   * Engineering units everywhere: dB, Hz, ms, %, 1-based strip numbers, enum TOKENS (index = OSC int).
#   * `params.<family>` keys are OSC paths RELATIVE to the family root. Strip families' roots are
#     `strips.<family>.path` (targets.py agrees); non-strip families' roots are `meta.roots` below.
#     Template variables: {n} / {id} come from the root, {band}/{send}/{idx} from the nodes `for` ranges.
#   * Each param spec: osc (f|i|s), exactly one of `scale` (name in `scales`) or `enum` (name in `enums`),
#     `node` (text format token, vocabulary below), `tier` (0 read-only, 1 mix move, 2 guarded),
#     optional `clamp: {min, max}` (engineering units) and `inverted_mute: true` (wire 1 = ON = unmuted).
#   * Node text format tokens (`node:`) — what the desk prints in `/node` replies / `/` writes:
#       str      double-quoted string ("Kick Drum", "")
#       int      plain integer (%d); ALSO used for the HPF frequency, which the console prints as an
#                integer Hz right-aligned in width 3 (scales_params.md §4.3 VERIFIED-CORRECTED) and for
#                gate/dyn release and attack (integers, width 4 for release)
#       sint     signed integer (%+d): pan "+0", "-100", "+50"
#       onoff    OFF / ON  <-> bool
#       enum     enum token (PEQ, GATE, FX4L, ...)
#       db1      level text: "-oo" for -inf, else %+.1f with EXACT 0 dB printed "0.0" (scales_params.md
#                §2.4); right-aligned in a 5-char field on the console. Parsers accept 0.0/+0.0/-0.0/-oo.
#       db2      signed %+.2f (EQ band gain "+3.25", "-0.50")
#       sfloat1  signed %+.1f, never -oo (preamp trim "+8.8", headamp gain "+0.0", automix weight)
#       float1   unsigned %.1f (gate thr "-46.5", range "27.0", dyn thr, Q "2.0" (max prints "10"),
#                delay time "0.3", solo sourcetrim)
#       float2   unsigned %.2f (RTA decay "1.00")
#       sig3     adaptive precision, console style (gate/dyn hold, dyn mgain): %.2f below 10 (0.02, 2.00, 8.00),
#                %.1f below 100 (79.6, 14.0), %.0f from 100 up (100, 502) — parse as a free-form float
#       freq     f201[] style: "124.7" below 1 kHz, "1k02" / "11k9" / "20k00" above (k = decimal point,
#                digits after k are ×100/×10/×1 for 1/2/3 digits, scales_params.md §0)
#       pct      integer percent (dyn mix "100")
#       float    free-form float
#       token    verbatim token, kept as text (FX parameters: display units depend on the effect type)
#       bits6/bits8/bits9/bits18  "%"-prefixed fixed-width bitmap, MSB first, bit 0 = item 1
#                (grp/mute %000000, grp/dca %00000001, scene safes %111111110, talk destmap)
#     Tokens beyond DESIGN.md §9's list (sfloat1, sig3, token, bits*) are research-driven additions.
#     `hex` from DESIGN.md is not used.
#   * Field ORDER in `nodes` is exactly the order the desk prints (verbatim lines in scales_params.md
#     §13 / transport.md §6.3). Token counts are firmware dependent: FW >= 3 appends `panFollow` to odd
#     sends (transport.md §6.3) — parse positionally, missing trailing fields -> None.

meta:
  model: X32
  osc_port: 10023
  protocol_ref: "Maillot Unofficial X32/M32 OSC Remote Protocol v4.06-09 / v4.09-02 (docs/research)"
  firmware_tested: "4.x"
  # OSC address roots of the non-strip param families (params.<family> relpaths are joined to these).
  # Strip families (ch, auxin, fxrtn, bus, mtx, main, dca) take their root from `strips`.
  roots:
    headamp: "/headamp/{n:03d}"      # n = 0..127: 000-031 local XLR, 032-079 AES50-A, 080-127 AES50-B (§12.2)
    fx: "/fx/{n}"                    # n = 1..8 (single digit, no zero padding)
    config: "/config"
    show: "/-show"
    stat: "/-stat"
    prefs: "/-prefs"
    action: "/-action"

# ----------------------------------------------------------------------------------------------------
# Named scales (scales.Scale). lin: v = lo + f*(hi-lo); log: v = lo*(hi/lo)**f; level = fader taper;
# `steps` = number of distinct values the desk stores (grid i/(steps-1)). Sources: scales_params.md §1-§2.
scales:
  fader:        {kind: level, steps: 1024, unit: dB}   # faders/main/dca: grid i/1023 (§2.3)
  send:         {kind: level, steps: 161,  unit: dB}   # sends, mlevel, solo/talk/osc level: grid i/160 (§2.3)
  pan:          {kind: pan, lo: -100, hi: 100, steps: 101}          # §3: f=(p+100)/200
  trim:         {kind: lin, lo: -18, hi: 18, steps: 145, unit: dB}  # §4.3 linf [-18,18,0.25]
  headamp_gain: {kind: lin, lo: -12, hi: 60, steps: 145, unit: dB}  # §12.1 linf [-12,60,0.5]
  eq_gain:      {kind: lin, lo: -15, hi: 15, steps: 121, unit: dB}  # §4.7 linf [-15,15,0.25]
  geq_gain:     {kind: lin, lo: -15, hi: 15, steps: 61,  unit: dB}  # fx_routing_scenes.md §2.2; 0.5 dB grid inferred (§14)
  freq:         {kind: log, lo: 20, hi: 20000, steps: 201, unit: Hz}  # §1.2 / §4.7
  hpf:          {kind: log, lo: 20, hi: 400, steps: 101, unit: Hz}    # §4.3
  q:            {kind: log, lo: 10, hi: 0.3, steps: 72}               # §4.7 DECREASING: f=0 -> Q 10, f=1 -> Q 0.3
  gate_thr:     {kind: lin, lo: -80, hi: 0, steps: 161, unit: dB}     # §4.4
  gate_range:   {kind: lin, lo: 3, hi: 60, steps: 58, unit: dB}       # §4.4
  dyn_thr:      {kind: lin, lo: -60, hi: 0, steps: 121, unit: dB}     # §4.5
  ms_attack:    {kind: lin, lo: 0, hi: 120, steps: 121, unit: ms}     # §4.4/§4.5
  ms_hold:      {kind: log, lo: 0.02, hi: 2000, steps: 101, unit: ms} # §4.4
  ms_release:   {kind: log, lo: 5, hi: 4000, steps: 101, unit: ms}    # §4.4
  knee:         {kind: lin, lo: 0, hi: 5, steps: 6}                   # §4.5
  mgain:        {kind: lin, lo: 0, hi: 24, steps: 49, unit: dB}       # §4.5
  pct5:         {kind: lin, lo: 0, hi: 100, steps: 21, unit: "%"}     # §4.5 dyn mix, 5 % grid
  delay_ms:     {kind: lin, lo: 0.3, hi: 500, steps: 4998, unit: ms}  # §4.2 linf [0.3,500,0.1]
  automix_weight: {kind: lin, lo: -12, hi: 12, steps: 49, unit: dB}   # §4.11
  solo_trim:    {kind: lin, lo: -18, hi: 18, steps: 73, unit: dB}     # §10 linf [-18,18,0.5]
  dim_att:      {kind: lin, lo: -40, hi: 0, steps: 41, unit: dB}      # §10 linf [-40,0,1]
  rta_gain:     {kind: lin, lo: 0, hi: 60, steps: 11, unit: dB}       # meters.md §5.1 linf [0,60,6]
  rta_decay:    {kind: log, lo: 0.25, hi: 16, steps: 19, unit: s}     # meters.md §5.1 logf [0.25,16,19] (unit presumed s)
  raw01:        {kind: lin, lo: 0, hi: 1}                             # pass-through 0..1 (FX params, see params.fx)
  bool:         {kind: bool}
  int:          {kind: int}
  str:          {kind: str}

# ----------------------------------------------------------------------------------------------------
# Enum token lists: index = OSC int. All tokens quoted (YAML 1.1 would read OFF/ON/Y as booleans).
enums:
  onoff: ["OFF", "ON"]
  color: ["OFF", "RD", "GN", "YE", "BL", "MG", "CY", "WH", "OFFi", "RDi", "GNi", "YEi", "BLi", "MGi", "CYi", "WHi"]   # §11.1
  eq_type: ["LCut", "LShv", "PEQ", "VEQ", "HShv", "HCut"]                                          # ch/auxin/fxrtn/bus (§4.7)
  eq_type_mtx: ["LCut", "LShv", "PEQ", "VEQ", "HShv", "HCut", "BU6", "BU12", "BS12", "LR12", "BU18", "BU24", "BS24", "LR24"]  # mtx/main (§7)
  hpslope: ["12", "18", "24"]                                                                       # dB/oct (§4.3)
  gate_mode: ["EXP2", "EXP3", "EXP4", "GATE", "DUCK"]                                              # §4.4 (emulator typo "EXP" ignored)
  dyn_mode: ["COMP", "EXP"]
  dyn_det: ["PEAK", "RMS"]
  dyn_env: ["LIN", "LOG"]
  dyn_ratio: ["1.1", "1.3", "1.5", "2.0", "2.5", "3.0", "4.0", "5.0", "7.0", "10", "20", "100"]     # §4.5
  filter_type: ["LC6", "LC12", "HC6", "HC12", "1.0", "2.0", "3.0", "5.0", "10.0"]                  # gate/dyn sidechain filter (§4.4)
  pos: ["PRE", "POST"]                                                                              # dyn/pos, insert/pos
  send_type: ["IN/LC", "<-EQ", "EQ->", "PRE", "POST", "GRP"]                                       # ch/auxin/fxrtn -> bus sends (§4.9)
  send_type_mtx: ["IN/LC", "<-EQ", "EQ->", "PRE", "POST"]                                          # bus/main -> matrix sends: 0..4 only (§6, §16.17)
  # /…/config/source and gate/dyn keysrc, int 0..64 (§11.3). Tokens are ours; the desk prints the int.
  ch_source: ["OFF", "IN01", "IN02", "IN03", "IN04", "IN05", "IN06", "IN07", "IN08", "IN09", "IN10", "IN11", "IN12", "IN13", "IN14", "IN15", "IN16", "IN17", "IN18", "IN19", "IN20", "IN21", "IN22", "IN23", "IN24", "IN25", "IN26", "IN27", "IN28", "IN29", "IN30", "IN31", "IN32", "AUX1", "AUX2", "AUX3", "AUX4", "AUX5", "AUX6", "USBL", "USBR", "FX1L", "FX1R", "FX2L", "FX2R", "FX3L", "FX3R", "FX4L", "FX4R", "BUS01", "BUS02", "BUS03", "BUS04", "BUS05", "BUS06", "BUS07", "BUS08", "BUS09", "BUS10", "BUS11", "BUS12", "BUS13", "BUS14", "BUS15", "BUS16"]
  # insert points, 23 entries: FX n side L -> 2n-1, R -> 2n; AUX k -> 16+k (fx_routing_scenes.md §3.2)
  insert_sel: ["OFF", "FX1L", "FX1R", "FX2L", "FX2R", "FX3L", "FX3R", "FX4L", "FX4R", "FX5L", "FX5R", "FX6L", "FX6R", "FX7L", "FX7R", "FX8L", "FX8R", "AUX1", "AUX2", "AUX3", "AUX4", "AUX5", "AUX6"]
  # /fx/1-4/type, 61 entries (fx_routing_scenes.md §1.2; GEQ2 = 27). The emulator's string array has
  # swapped pairs — the DOC / scene parser order below is the truth.
  fx_type_14: ["HALL", "AMBI", "RPLT", "ROOM", "CHAM", "PLAT", "VREV", "VRM", "GATE", "RVRS", "DLY", "3TAP", "4TAP", "CRS", "FLNG", "PHAS", "DIMC", "FILT", "ROTA", "PAN", "SUB", "D/RV", "CR/R", "FL/R", "D/CR", "D/FL", "MODD", "GEQ2", "GEQ", "TEQ2", "TEQ", "DES2", "DES", "P1A", "P1A2", "PQ5", "PQ5S", "WAVD", "LIM", "CMB", "CMB2", "FAC", "FAC1M", "FAC2", "LEC", "LEC2", "ULC", "ULC2", "ENH2", "ENH", "EXC2", "EXC", "IMG", "EDI", "SON", "AMP2", "AMP", "DRV2", "DRV", "PIT2", "PIT"]
  # /fx/5-8/type, 34 entries (fx_routing_scenes.md §1.3; GEQ2 = 0). Insert-only slots: no /source, no fxrtn.
  fx_type_58: ["GEQ2", "GEQ", "TEQ2", "TEQ", "DES2", "DES", "P1A", "P1A2", "PQ5", "PQ5S", "WAVD", "LIM", "FAC", "FAC1M", "FAC2", "LEC", "LEC2", "ULC", "ULC2", "ENH2", "ENH", "EXC2", "EXC", "IMG", "EDI", "SON", "AMP2", "AMP", "DRV2", "DRV", "PHAS", "FILT", "PAN", "SUB"]
  fx_source: ["INS", "MIX1", "MIX2", "MIX3", "MIX4", "MIX5", "MIX6", "MIX7", "MIX8", "MIX9", "MIX10", "MIX11", "MIX12", "MIX13", "MIX14", "MIX15", "MIX16", "M/C"]   # §1.4
  routswitch: ["REC", "PLAY"]                                                                       # §4.2
  # /config/routing/IN|PLAY/{1-8,...,25-32}, 0..23 (§4.3)
  routing_in: ["AN1-8", "AN9-16", "AN17-24", "AN25-32", "A1-8", "A9-16", "A17-24", "A25-32", "A33-40", "A41-48", "B1-8", "B9-16", "B17-24", "B25-32", "B33-40", "B41-48", "CARD1-8", "CARD9-16", "CARD17-24", "CARD25-32", "UIN1-8", "UIN9-16", "UIN17-24", "UIN25-32"]
  # /config/routing/IN|PLAY/AUX, 0..15 (§4.4; token 0 "AUX1-4" really means the 6 local AUX inputs)
  routing_in_aux: ["AUX1-4", "AN1-2", "AN1-4", "AN1-6", "A1-2", "A1-4", "A1-6", "B1-2", "B1-4", "B1-6", "CARD1-2", "CARD1-4", "CARD1-6", "UIN1-2", "UIN1-4", "UIN1-6"]
  # /config/routing/AES50A|AES50B|CARD/<block>, 0..35 (§4.5)
  routing_aes: ["AN1-8", "AN9-16", "AN17-24", "AN25-32", "A1-8", "A9-16", "A17-24", "A25-32", "A33-40", "A41-48", "B1-8", "B9-16", "B17-24", "B25-32", "B33-40", "B41-48", "CARD1-8", "CARD9-16", "CARD17-24", "CARD25-32", "OUT1-8", "OUT9-16", "P161-8", "P169-16", "AUX1-6/Mon", "AuxIN1-6/TB", "UOUT1-8", "UOUT9-16", "UOUT17-24", "UOUT25-32", "UOUT33-40", "UOUT41-48", "UIN1-8", "UIN9-16", "UIN17-24", "UIN25-32"]
  # /config/routing/OUT/1-4 and 9-12 (list A) / 5-8 and 13-16 (list B), 0..35 (§4.6)
  routing_out_a: ["AN1-4", "AN9-12", "AN17-20", "AN25-28", "A1-4", "A9-12", "A17-20", "A25-28", "A33-36", "A41-44", "B1-4", "B9-12", "B17-20", "B25-28", "B33-36", "B41-44", "CARD1-4", "CARD9-12", "CARD17-20", "CARD25-28", "OUT1-4", "OUT9-12", "P161-4", "P169-12", "AUX/CR", "AUX/TB", "UOUT1-4", "UOUT9-12", "UOUT17-20", "UOUT25-28", "UOUT33-36", "UOUT41-44", "UIN1-4", "UIN9-12", "UIN17-20", "UIN25-28"]
  routing_out_b: ["AN5-8", "AN13-16", "AN21-24", "AN29-32", "A5-8", "A13-16", "A21-24", "A29-32", "A37-40", "A45-48", "B5-8", "B13-16", "B21-24", "B29-32", "B37-40", "B45-48", "CARD5-8", "CARD13-16", "CARD21-24", "CARD29-32", "OUT5-8", "OUT13-16", "P165-8", "P1613-16", "AUX/CR", "AUX/TB", "UOUT5-8", "UOUT13-16", "UOUT21-24", "UOUT29-32", "UOUT37-40", "UOUT45-48", "UIN5-8", "UIN13-16", "UIN21-24", "UIN29-32"]
  solo_source: ["OFF", "LR", "LR+C", "LRPFL", "LRAFL", "AUX56", "AUX78"]                            # §10
  pfl_afl: ["PFL", "AFL"]
  talk_source: ["INT", "EXT"]
  mono_mode: ["LR+M", "LCR"]
  automix_group: ["OFF", "X", "Y"]
  show_control: ["CUES", "SCENES", "SNIPPETS"]                                                       # fx_routing_scenes.md §6.2
  # /-prefs/rta/source, int 0..73 (meters.md §5.1): 0 none (dynamic/selected), 1 Monitor, 2-33 Ch,
  # 34-41 Aux, 42-49 FX rtn, 50-65 Bus, 66-71 Mtx, 72 Main LR, 73 Mono. Tokens are ours (desk prints the int).
  rta_source: ["NONE", "MONITOR", "CH01", "CH02", "CH03", "CH04", "CH05", "CH06", "CH07", "CH08", "CH09", "CH10", "CH11", "CH12", "CH13", "CH14", "CH15", "CH16", "CH17", "CH18", "CH19", "CH20", "CH21", "CH22", "CH23", "CH24", "CH25", "CH26", "CH27", "CH28", "CH29", "CH30", "CH31", "CH32", "AUX1", "AUX2", "AUX3", "AUX4", "AUX5", "AUX6", "AUX7", "AUX8", "FX1L", "FX1R", "FX2L", "FX2R", "FX3L", "FX3R", "FX4L", "FX4R", "BUS01", "BUS02", "BUS03", "BUS04", "BUS05", "BUS06", "BUS07", "BUS08", "BUS09", "BUS10", "BUS11", "BUS12", "BUS13", "BUS14", "BUS15", "BUS16", "MTX1", "MTX2", "MTX3", "MTX4", "MTX5", "MTX6", "MAIN", "MONO"]
  rta_pos: ["PRE", "POST"]
  rta_mode: ["BAR", "SPEC"]
  rta_det: ["PEAK", "RMS"]      # raw 0 = PEAK, raw 1 = RMS: the console's own /node label (meters.md 2026-09-25 item 5). The DOC and
                                #   X32.c PRdet[] list RMS first; that order was in this file until 2026-09-25 and made every "PEAK" write RMS.
  rta_visibility: ["OFF", "25%", "30%", "35%", "40%", "45%", "50%", "55%", "60%", "65%", "70%", "75%", "80%"]
  rta_peakhold: ["OFF", "1", "2", "3", "4", "5", "6", "7", "8"]

# ----------------------------------------------------------------------------------------------------
strips:
  ch:    {count: 32, path: "/ch/{n:02d}", label: "Ch", sends: 16, eq_bands: 4, preamp: true, gate: true, dyn: true, insert: true}
  auxin: {count: 8,  path: "/auxin/{n:02d}", label: "Aux In", sends: 16, eq_bands: 4, preamp: true}   # preamp = trim+invert only; no gate/dyn/insert/delay (§5)
  fxrtn: {count: 8,  path: "/fxrtn/{n:02d}", label: "FX Rtn", sends: 16, eq_bands: 4}                  # no preamp, no config/source (§5)
  bus:   {count: 16, path: "/bus/{n:02d}", label: "Bus", sends: 6, send_target: mtx, eq_bands: 6, dyn: true, insert: true}
  mtx:   {count: 6,  path: "/mtx/{n:02d}", label: "Matrix", eq_bands: 6, dyn: true, insert: true}      # mix = on/fader only; preamp = invert only (§7)
  main:  {ids: [st, m], path: "/main/{id}", label: {st: "Main LR", m: "Main M/C"}, sends: 6, send_target: mtx, eq_bands: 6, dyn: true, insert: true}
  dca:   {count: 8,  path: "/dca/{n}", label: "DCA"}                                                   # on/fader sit directly under /dca/N (§9)

# ----------------------------------------------------------------------------------------------------
# Parameter map. Shared blocks are anchored in `ch` and merged into the other families.
params:
  ch:
    <<:
      - &blk_config                       # name icon color (node BSCO/CHCO order)
        config/name:  {osc: s, scale: str, node: str, tier: 1}                         # <= 12 chars (§4.1)
        config/icon:  {osc: i, scale: int, node: int, tier: 1, clamp: {min: 1, max: 74}}
        config/color: {osc: i, enum: color, node: enum, tier: 1}
      - &blk_preamp_trim                  # auxin has exactly this pair (§5); ch adds hpf below
        preamp/trim:   {osc: f, scale: trim, node: sfloat1, tier: 1}                   # digital sources only (§4.3)
        preamp/invert: {osc: i, scale: bool, node: onoff, tier: 1}
      - &blk_gate                         # node order: on mode thr range attack hold release keysrc (§4.4)
        gate/on:      {osc: i, scale: bool, node: onoff, tier: 1}
        gate/mode:    {osc: i, enum: gate_mode, node: enum, tier: 1}
        gate/thr:     {osc: f, scale: gate_thr, node: float1, tier: 1}
        gate/range:   {osc: f, scale: gate_range, node: float1, tier: 1}
        gate/attack:  {osc: f, scale: ms_attack, node: int, tier: 1}
        gate/hold:    {osc: f, scale: ms_hold, node: sig3, tier: 1}
        gate/release: {osc: f, scale: ms_release, node: int, tier: 1}
        gate/keysrc:  {osc: i, enum: ch_source, node: int, tier: 1}                    # 0 = OFF = self-keyed
        gate/filter/on:   {osc: i, scale: bool, node: onoff, tier: 1}
        gate/filter/type: {osc: i, enum: filter_type, node: enum, tier: 1}
        gate/filter/f:    {osc: f, scale: freq, node: freq, tier: 1}
      - &blk_dyn_core                     # node order: on mode det env thr ratio knee mgain attack hold release pos [keysrc] mix auto (§4.5)
        dyn/on:      {osc: i, scale: bool, node: onoff, tier: 1}
        dyn/mode:    {osc: i, enum: dyn_mode, node: enum, tier: 1}
        dyn/det:     {osc: i, enum: dyn_det, node: enum, tier: 1}
        dyn/env:     {osc: i, enum: dyn_env, node: enum, tier: 1}
        dyn/thr:     {osc: f, scale: dyn_thr, node: float1, tier: 1}
        dyn/ratio:   {osc: i, enum: dyn_ratio, node: enum, tier: 1}
        dyn/knee:    {osc: f, scale: knee, node: int, tier: 1}
        dyn/mgain:   {osc: f, scale: mgain, node: sig3, tier: 1}                       # console prints "8.00" / "14.0"
        dyn/attack:  {osc: f, scale: ms_attack, node: int, tier: 1}
        dyn/hold:    {osc: f, scale: ms_hold, node: sig3, tier: 1}
        dyn/release: {osc: f, scale: ms_release, node: int, tier: 1}
        dyn/pos:     {osc: i, enum: pos, node: enum, tier: 1}
        dyn/mix:     {osc: f, scale: pct5, node: pct, tier: 1}
        dyn/auto:    {osc: i, scale: bool, node: onoff, tier: 1}                       # FW >= 2.10
      - &blk_dyn_keysrc                   # ch and bus only; mtx/main have no keysrc (§7, §8)
        dyn/keysrc:  {osc: i, enum: ch_source, node: int, tier: 1}
      - &blk_dyn_filter                   # node order: on type f
        dyn/filter/on:   {osc: i, scale: bool, node: onoff, tier: 1}
        dyn/filter/type: {osc: i, enum: filter_type, node: enum, tier: 1}
        dyn/filter/f:    {osc: f, scale: freq, node: freq, tier: 1}
      - &blk_insert                       # node order: on pos sel (§4.6); Tier 2 (guarded "/*/insert/*")
        insert/on:  {osc: i, scale: bool, node: onoff, tier: 2}
        insert/pos: {osc: i, enum: pos, node: enum, tier: 2}
        insert/sel: {osc: i, enum: insert_sel, node: enum, tier: 2}
      - &blk_eq                           # /eq = on; /eq/{band} = type f g q (§4.7); band count = strips.eq_bands
        eq/on: {osc: i, scale: bool, node: onoff, tier: 1}
        "eq/{band}/type": {osc: i, enum: eq_type, node: enum, tier: 1}
        "eq/{band}/f":    {osc: f, scale: freq, node: freq, tier: 1}
        "eq/{band}/g":    {osc: f, scale: eq_gain, node: db2, tier: 1, clamp: {min: -15, max: 15}}
        "eq/{band}/q":    {osc: f, scale: q, node: float1, tier: 1}
      - &blk_mix_full                     # node order: on fader st pan mono mlevel (§4.8)
        mix/on:     {osc: i, scale: bool, node: onoff, tier: 1, inverted_mute: true}   # wire 1 = ON = unmuted
        mix/fader:  {osc: f, scale: fader, node: db1, tier: 1, clamp: {max: 5}}        # policy.ch_fader_max_db
        mix/st:     {osc: i, scale: bool, node: onoff, tier: 1}                        # assigned to Main L/R
        mix/pan:    {osc: f, scale: pan, node: sint, tier: 1}
        mix/mono:   {osc: i, scale: bool, node: onoff, tier: 1}                        # assigned to M/C
        mix/mlevel: {osc: f, scale: send, node: db1, tier: 1, clamp: {max: 0}}         # M/C send level, 161 grid
      - &blk_sends                        # odd sends: on level pan type panFollow; even sends: on level (§4.9)
        "mix/{send:02d}/on":    {osc: i, scale: bool, node: onoff, tier: 1, inverted_mute: true}
        "mix/{send:02d}/level": {osc: f, scale: send, node: db1, tier: 1, clamp: {max: 0}}   # 161 grid (§2.3)
        "mix/{send:02d}/pan":   {osc: f, scale: pan, node: sint, tier: 1}                    # odd sends only (stereo pair)
        "mix/{send:02d}/type":  {osc: i, enum: send_type, node: enum, tier: 1}               # odd sends only
        # FW >= 4.0; PDF types it enum {OFF,ON} but SetSceneParse.c (real .scn files) reads it with Xp_int
        # and the emulator prints Sint -> node text "0"/"1" (scales_params.md §4.9, UNCONFIRMED token form)
        "mix/{send:02d}/panFollow": {osc: i, scale: bool, node: int, tier: 1}
      - &blk_grp                          # node: dca mute (§4.10). bit0 = DCA1 / mute group 1 (VERIFIED, real scene)
        grp/dca:  {osc: i, scale: int, node: bits8, tier: 2, clamp: {min: 0, max: 255}}
        grp/mute: {osc: i, scale: int, node: bits6, tier: 2, clamp: {min: 0, max: 63}}
    config/source:  {osc: i, enum: ch_source, node: int, tier: 2}                      # Tier 2 (guarded "/*/config/source")
    delay/on:       {osc: i, scale: bool, node: onoff, tier: 1}
    delay/time:     {osc: f, scale: delay_ms, node: float1, tier: 1}                   # console "  0.3" (width 5)
    preamp/hpon:    {osc: i, scale: bool, node: onoff, tier: 1}
    preamp/hpslope: {osc: i, enum: hpslope, node: enum, tier: 1}
    preamp/hpf:     {osc: f, scale: hpf, node: int, tier: 1}                           # console: integer Hz, width 3 ("24  79")
    automix/group:  {osc: i, enum: automix_group, node: enum, tier: 1}                 # ch 01-08 only (§4.11)
    automix/weight: {osc: f, scale: automix_weight, node: sfloat1, tier: 1}            # ch 01-08 only

