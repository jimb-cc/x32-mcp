    talk/B/destmap: {osc: i, scale: int, node: bits18, tier: 0}
    mono/mode: {osc: i, enum: mono_mode, node: enum, tier: 0}                           # LR+M / LCR
    mono/link: {osc: i, scale: bool, node: onoff, tier: 0}

  show:                                   # fx_routing_scenes.md §6. Read-only: recall/save go through -action and /save
    prepos/current: {osc: i, scale: int, node: int, tier: 0}                            # scene slot 0..99 when show_control = SCENES
    showfile/show/name:     {osc: s, scale: str, node: str, tier: 0}
    showfile/show/inputs:   {osc: i, scale: int, node: int, tier: 0}                    # param-safe bitmaps, printed as plain ints
    showfile/show/mxsends:  {osc: i, scale: int, node: int, tier: 0}
    showfile/show/mxbuses:  {osc: i, scale: int, node: int, tier: 0}
    showfile/show/console:  {osc: i, scale: int, node: int, tier: 0}
    showfile/show/chan16:   {osc: i, scale: int, node: int, tier: 0}
    showfile/show/chan32:   {osc: i, scale: int, node: int, tier: 0}
    showfile/show/return:   {osc: i, scale: int, node: int, tier: 0}
    showfile/show/buses:    {osc: i, scale: int, node: int, tier: 0}
    showfile/show/lrmtxdca: {osc: i, scale: int, node: int, tier: 0}
    showfile/show/effects:  {osc: i, scale: int, node: int, tier: 0}
    "showfile/scene/{idx:03d}/name":    {osc: s, scale: str, node: str, tier: 0}
    "showfile/scene/{idx:03d}/notes":   {osc: s, scale: str, node: str, tier: 0}
    "showfile/scene/{idx:03d}/safes":   {osc: i, scale: int, node: bits9, tier: 0}     # 9-bit safes bitmap "%111111110"
    "showfile/scene/{idx:03d}/hasdata": {osc: i, scale: int, node: int, tier: 0}

  stat:                                   # fx_routing_scenes.md §7.1 / meters.md §5.2 — all read-only leaves
    selidx:     {osc: i, scale: int, node: int, tier: 0}                                # 0-31 ch, 32-39 aux, 40-47 fxrtn, 48-63 bus, 64-69 mtx, 70 LR, 71 M/C
    solo:       {osc: i, scale: bool, node: onoff, tier: 0}                             # any solo active
    talk/A:     {osc: i, scale: bool, node: onoff, tier: 0}
    talk/B:     {osc: i, scale: bool, node: onoff, tier: 0}
    rtasource:  {osc: i, scale: int, node: int, tier: 0}                                # 0-72 pre-EQ, +98 post-EQ (rta.stat_param)
    rtamodeeq:  {osc: i, enum: rta_mode, node: enum, tier: 0}
    rtamodegeq: {osc: i, enum: rta_mode, node: enum, tier: 0}
    rtaeqpre:   {osc: i, scale: bool, node: onoff, tier: 0}
    rtageqpost: {osc: i, scale: bool, node: onoff, tier: 0}
    geqonfdr:   {osc: i, scale: bool, node: onoff, tier: 0}
    geqpos:     {osc: i, scale: int, node: int, tier: 0}                                # (fx# << 8) | start band
    dcaspill:   {osc: i, scale: int, node: int, tier: 0}
    # The console's screen page and METERS tab (fx_routing_scenes.md: 0 CHAN(HOME) 1 METERS 2 ROUTE 3 SETUP 4 LIB 5 FX 6 MON 7 USB
    # 8 SCENE 9 ASSIGN 10 LOCK). Writable: remote page select. Showing the METERS/RTA tab (page 4) once STARTS the analyser behind
    # /meters/15, which otherwise carries one static flat frame after a power-up (meters.md 2026-09-25 item 1; meters.wake_rta_analyser).
    screen/screen:     {osc: i, scale: int, node: int, tier: 1}
    screen/METER/page: {osc: i, scale: int, node: int, tier: 1}

  prefs:                                  # meters.md §5.1 (rta), fx_routing_scenes.md §7.2
    name:         {osc: s, scale: str, node: str, tier: 0}                              # console name (also in /xinfo)
    show_control: {osc: i, enum: show_control, node: enum, tier: 1}                     # SCENES makes the desk push prepos/current
    # /node -prefs/rta order: visibility gain autogain source pos mode options det decay peakhold
    rta/visibility: {osc: i, enum: rta_visibility, node: enum, tier: 1}
    rta/gain:       {osc: f, scale: rta_gain, node: int, tier: 1}                       # 6 dB steps, printed as int
    rta/autogain:   {osc: i, scale: bool, node: onoff, tier: 1}
    rta/source:     {osc: i, enum: rta_source, node: int, tier: 1}                      # desk prints the int
    rta/pos:        {osc: i, enum: rta_pos, node: enum, tier: 1}
    rta/mode:       {osc: i, enum: rta_mode, node: enum, tier: 1}
    rta/options:    {osc: i, scale: int, node: bits6, tier: 1}                          # bit 5 = Solo Priority (clear it)
    rta/det:        {osc: i, enum: rta_det, node: enum, tier: 1}
    rta/decay:      {osc: f, scale: rta_decay, node: float2, tier: 1}
    rta/peakhold:   {osc: i, enum: rta_peakhold, node: enum, tier: 1}

  action:                                 # fx_routing_scenes.md §8 — write-only triggers, Tier 2 (guarded "/-action/*")
    goscene:   {osc: i, scale: int, node: int, tier: 2, clamp: {min: 0, max: 99}}
    gocue:     {osc: i, scale: int, node: int, tier: 2, clamp: {min: 0, max: 99}}
    gosnippet: {osc: i, scale: int, node: int, tier: 2, clamp: {min: 0, max: 99}}

# ----------------------------------------------------------------------------------------------------
# /node sections for dump/snapshot, in sweep order (= the order a console-saved scene file prints them).
# Strip sections: path = strips.<family>.path + "/" + section; non-strip sections carry an absolute `path`.
# `for` expands template vars (inclusive ranges); `fields_even` replaces `fields` when the `for` var is even.
nodes:
  # ---- channels (scales_params.md §4, scene1.scn lines 33-64)
  - {family: ch, section: "config", fields: [config/name, config/icon, config/color, config/source]}
  - {family: ch, section: "delay", fields: [delay/on, delay/time]}
  - {family: ch, section: "preamp", fields: [preamp/trim, preamp/invert, preamp/hpon, preamp/hpslope, preamp/hpf]}
  - {family: ch, section: "gate", fields: [gate/on, gate/mode, gate/thr, gate/range, gate/attack, gate/hold, gate/release, gate/keysrc]}
  - {family: ch, section: "gate/filter", fields: [gate/filter/on, gate/filter/type, gate/filter/f]}
  - {family: ch, section: "dyn", fields: [dyn/on, dyn/mode, dyn/det, dyn/env, dyn/thr, dyn/ratio, dyn/knee, dyn/mgain, dyn/attack, dyn/hold, dyn/release, dyn/pos, dyn/keysrc, dyn/mix, dyn/auto]}
  - {family: ch, section: "dyn/filter", fields: [dyn/filter/on, dyn/filter/type, dyn/filter/f]}
  - {family: ch, section: "insert", fields: [insert/on, insert/pos, insert/sel]}
  - {family: ch, section: "eq", fields: [eq/on]}
  - {family: ch, section: "eq/{band}", for: {band: [1, 4]}, fields: ["eq/{band}/type", "eq/{band}/f", "eq/{band}/g", "eq/{band}/q"]}
  - {family: ch, section: "mix", fields: [mix/on, mix/fader, mix/st, mix/pan, mix/mono, mix/mlevel]}
  - {family: ch, section: "mix/{send:02d}", for: {send: [1, 16]},
     fields: ["mix/{send:02d}/on", "mix/{send:02d}/level", "mix/{send:02d}/pan", "mix/{send:02d}/type", "mix/{send:02d}/panFollow"],
     fields_even: ["mix/{send:02d}/on", "mix/{send:02d}/level"]}
