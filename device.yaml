  - {family: prefs, path: "/-prefs/rta", fields: [rta/visibility, rta/gain, rta/autogain, rta/source, rta/pos, rta/mode, rta/options, rta/det, rta/decay, rta/peakhold]}

# ----------------------------------------------------------------------------------------------------
# Tier 2 address globs (fnmatch on the concrete address), in addition to per-param `tier: 2`.
guarded:
  - "/main/st/mix/*"
  - "/main/m/mix/*"
  - "/headamp/*/phantom"
  - "/config/routing/*"
  - "/config/mute/*"
  - "/*/insert/*"
  - "/fx/*/type"
  - "/fx/*/source/*"
  - "/*/config/source"
  - "/*/grp/*"
  - "/-action/*"
  - "/save"
  - "/load"

policy:
  ch_fader_max_db: 5
  bus_fader_max_db: 0        # bus masters (also the ring-out ceiling)
  main_fader_max_db: 0
  send_max_db: 0
  eq_gain_abs_max_db: 15
  relative_max_db: 6
  relative_max_db_show_mode: 3
  ramp_default_ms: 300
  ramp_step_ms: 20
  writes_per_second: 50
  # 5 minutes, not 60 s: a confirmation is a CONVERSATIONAL round trip (the model surfaces the
  # prompt, the operator reads it on a phone at FOH and answers by voice), which ran past 60 s
  # during M5 on 2026-09-20. Too short a TTL teaches an agent to re-mint tokens, which defeats
  # the gate entirely. Still single-use and still bound to one action.
  confirm_token_ttl_s: 300
  read_cache_ttl_s: 2.0
  show_mode_default: false

# RTA: /meters/15 = 50 LE words = 100 int16 LE, dB = v/256 (-128 floor, 0 = clip) — meters.md §4.2 VERIFIED.
rta:
  meter_type: 15
  bands: 100
  # band centres, Hz: 10000 * 2 ** ((i - 90) / 10), rounded to 2 decimals (meters.md §4.2, VERIFIED against the DOC table)
  band_hz: [
    19.53, 20.93, 22.44, 24.05, 25.77, 27.62, 29.6, 31.73, 34.01, 36.45,
    39.06, 41.87, 44.87, 48.09, 51.54, 55.24, 59.21, 63.46, 68.01, 72.89,
    78.12, 83.73, 89.74, 96.18, 103.09, 110.49, 118.42, 126.91, 136.02, 145.79,
    156.25, 167.46, 179.48, 192.37, 206.17, 220.97, 236.83, 253.83, 272.05, 291.57,
    312.5, 334.93, 358.97, 384.73, 412.35, 441.94, 473.66, 507.66, 544.09, 583.15,
    625, 669.86, 717.94, 769.47, 824.69, 883.88, 947.32, 1015.32, 1088.19, 1166.29,
    1250, 1339.72, 1435.87, 1538.93, 1649.38, 1767.77, 1894.65, 2030.63, 2176.38, 2332.58,
    2500, 2679.43, 2871.75, 3077.86, 3298.77, 3535.53, 3789.29, 4061.26, 4352.75, 4665.16,
    5000, 5358.87, 5743.49, 6155.72, 6597.54, 7071.07, 7578.58, 8122.52, 8705.51, 9330.33,
    10000, 10717.73, 11486.98, 12311.44, 13195.08, 14142.14, 15157.17, 16245.05, 17411.01, 18660.66]
  source_param: "/-prefs/rta/source"     # enum rta_source: 0 none, 1 Monitor, 2-33 Ch, 34-41 Aux, 42-49 FX, 50-65 Bus, 66-71 Mtx, 72 Main, 73 Mono
  pos_param: "/-prefs/rta/pos"           # 0 PRE, 1 POST
  options_param: "/-prefs/rta/options"   # bit 5 = Solo Priority (clear it); bits 0-4 only affect EQ/GEQ overlay views
  stat_param: "/-stat/rtasource"         # read-back: 0-72 pre-EQ, +98 post-EQ (Bus N post = 146+N-1, Main LR post = 168)
  # Both MUST be forced before arming the detector (found at M7, 2026-09-20):
  # auto-gain normalises the whole display, so every band drifts together when the overall level
  # moves and the detector reads that as the growth signature of feedback; RMS blunts a narrow tone.
  autogain_param: "/-prefs/rta/autogain" # 0/1 - the detector needs absolute levels, so force 0
  det_param: "/-prefs/rta/det"           # 0 RMS, 1 PEAK - force PEAK, feedback is a narrow tone
  frame_period_s: 0.05

geq:
  fx_types_dual: [GEQ2, TEQ2]   # dual-mono: par 1-31 = side A bands, 32 = master A, 33-63 = side B bands, 64 = master B (fx_routing_scenes.md §2)
  fx_types_stereo: [GEQ, TEQ]   # par 1-31 bands, 32 master
  # ISO 1/3-octave centres, par 1 -> 31 ascending (fx_routing_scenes.md §2.3, corroborated by the /-stat/geqpos example)
  band_hz: [20, 25, 31.5, 40, 50, 63, 80, 100, 125, 160, 200, 250, 315, 400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300, 8000, 10000, 12500, 16000, 20000]
  par_a_first: 1
  par_a_master: 32
  par_b_first: 33
  par_b_master: 64
  gain_scale: geq_gain          # linf -15..+15 dB (0.5 dB grid -> 61 steps)
  insert_slots_preferred: [5, 6, 7, 8]   # fx 5-8 are insert-only; NOTE fx 5-8 use a DIFFERENT type enum (fx_type_58: GEQ2 = 0) from fx 1-4 (fx_type_14: GEQ2 = 27)
  insert_sel_enum: insert_sel   # 0 OFF, 1 FX1L, 2 FX1R, … 16 FX8R, 17-22 AUX1-6 (23 entries)

detector:
  prominence_db: 12
  neighbour_bins: 3
  # Candidates quieter than this are ignored. Calibrated UP at arm time to sit
  # floor_margin_db above the room's measured noise floor (see cfs._calibrate_floor): at M7 this
  # -60 dB sat 8 dB BELOW the studio's own 48 Hz rumble (-51.7 dB peak), so room noise qualified
  # as feedback and spent the notch budget before a fader moved. A pub, a field and a studio all
  # differ, so this is a lower bound, not the answer. floor_margin_db 0 disables calibration.
  # Candidates quieter than this are ignored. -60 was measured WRONG on real hardware at M7: the
  # loudest band in a silent studio was -51.7 dB (48 Hz rumble), so the room's own noise floor
  # cleared the gate by 8 dB and ordinary rumble qualified as feedback, spending the whole notch
  # budget before a fader moved. -45 sits above that floor and still leaves ~20 dB of headroom
  # below the -25 dB howl that was actually missed.
  # NOTE: this is one room. A noisier venue needs it higher, and calibrating it automatically from
  # a measured floor at arm time is the proper fix (attempted 2026-09-20, backed out unfinished).
  min_level_db: -45
  floor_margin_db: 8
  floor_sample_s: 2.0        # time cap
  floor_sample_frames: 40    # enough frames (2 s at 20 fps); whichever comes first
  persistence_frames: 3
  growth_min_db_per_s: 6
  growth_ref_db_per_s: 20
  monotonic_tolerance_db: 1.0
  weights: {prominence: 0.3, persistence: 0.2, growth: 0.5}
  confidence_threshold: 0.7
  # Established-feedback override (added after M7, 2026-09-20). Without growth the weighted score
  # cannot exceed prominence+persistence = 0.5, below the 0.7 threshold, so a howl that has already
  # plateaued could never be emitted: a 60 dB-prominent 8 kHz ring sat at 0.50 for 15 s on the real
  # desk. Musical content is harmonically spread, so this much prominence in one band is feedback by
  # construction. 0 disables the override.
  override_prominence_db: 25
  override_persistence_frames: 6
  band_tolerance: 1
  cooldown_s: 1.0
  notch_step_db: -3
  notch_max_db: -9
  notch_budget_default: 6
  merge_adjacent_bands: 1
  decay_verify_db: 6         # ring must drop >= this within decay_verify_s after a notch
  decay_verify_s: 1.5
  decay_verify_frames: 2     # consecutive frames that must show the drop (one dip is RTA noise)
  frame_period_s: 0.05

ringout:
  step_db: 1.0
  dwell_ms: 1500
  safety_margin_db: 3
  abort_backoff_db: 6
  master_ceiling_db: 0
  start_warn_db: -10         # warn if bus master starts above this

mics:
  send_floor_db: -40
  # An open mic hears the room: with typical gain a live vocal mic idles at -70..-55 dBFS, an input with nothing
  # plugged in reads the preamp floor (DOC: ~-100). Below this a candidate is flagged "no input signal" (not excluded).
  signal_floor_db: -80
  mute_group_convention: 6
