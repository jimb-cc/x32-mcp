  - {family: ch, section: "gate/filter", fields: [gate/filter/on, gate/filter/type, gate/filter/f]}
  - {family: ch, section: "dyn", fields: [dyn/on, dyn/mode, dyn/det, dyn/env, dyn/thr, dyn/ratio, dyn/knee, dyn/mgain, dyn/attack, dyn/hold, dyn/release, dyn/pos, dyn/keysrc, dyn/mix, dyn/auto]}
