  # leaves with the enum token / "%d", transport.md §6.2). The node path IS the leaf address here.
  - {family: stat, path: "/-stat/rtamodeeq", fields: [rtamodeeq]}
  - {family: stat, path: "/-stat/rtamodegeq", fields: [rtamodegeq]}
  - {family: stat, path: "/-stat/rtaeqpre", fields: [rtaeqpre]}
  - {family: stat, path: "/-stat/rtageqpost", fields: [rtageqpost]}
  - {family: stat, path: "/-stat/rtasource", fields: [rtasource]}
  - {family: stat, path: "/-stat/screen/screen", fields: [screen/screen]}
  - {family: stat, path: "/-stat/screen/METER/page", fields: [screen/METER/page]}
  # ---- RTA prefs (meters.md §5.1): order visibility gain autogain source pos mode options det decay peakhold
  - {family: prefs, path: "/-prefs/rta", fields: [rta/visibility, rta/gain, rta/autogain, rta/source, rta/pos, rta/mode, rta/options, rta/det, rta/decay, rta/peakhold]}

# ----------------------------------------------------------------------------------------------------
# Tier 2 address globs (fnmatch on the concrete address), in addition to per-param `tier: 2`.
guarded:
  - "/main/st/mix/*"
  - "/main/m/mix/*"
  # The mains' processing is as much a level control as their faders: +24 dB of compressor make-up
  # or a +15 dB EQ shelf on Main LR is a house-wide jump with no ramp. Nothing on the PA bus is Tier 1.
  - "/main/*/dyn/*"
  - "/main/*/eq/*"
  - "/headamp/*/phantom"
  - "/config/routing/*"
  - "/config/mute/*"
  - "/*/insert/*"
  - "/fx/*/type"
  - "/fx/*/source/*"
  - "/*/config/source"
  - "/*/grp/*"
  - "/-action/*"
  - "/save"
  - "/load"

policy:
  ch_fader_max_db: 5
  bus_fader_max_db: 0        # bus masters (also the ring-out ceiling)
  main_fader_max_db: 0
  send_max_db: 0
  dca_fader_max_db: 0        # a DCA raises every member strip at once: bus-like ceiling, not the channel +5
  eq_gain_abs_max_db: 15
  # Compressor make-up gain is plain broadband gain after the fader's neighbourhood: through a Tier-1
  # tool it is bounded like a relative move, not like the desk's 0..24 dB range.
  dyn_makeup_max_db: 6
  relative_max_db: 6
  relative_max_db_show_mode: 3
  ramp_default_ms: 300
  ramp_step_ms: 20
  writes_per_second: 50
  # 5 minutes, not 60 s: a confirmation is a CONVERSATIONAL round trip (the model surfaces the
  # prompt, the operator reads it on a phone at FOH and answers by voice), which ran past 60 s
  # during M5 on 2026-09-20. Too short a TTL teaches an agent to re-mint tokens, which defeats
  # the gate entirely. Still single-use and still bound to one action.
  confirm_token_ttl_s: 300
  read_cache_ttl_s: 2.0
  show_mode_default: false

# RTA: /meters/15 = 50 LE words = 100 int16 LE, dB = v/256 (-128 floor, 0 = clip) — meters.md §4.2 VERIFIED.
rta:
  meter_type: 15
  bands: 100
  # band centres, Hz: 20 * 2 ** (i / 10), rounded to 2 decimals — MEASURED on the desk 2026-09-23 (meters.md Verification
  # log item 8): the analysis bins sit a constant +0.034 oct above the DOC p.19 table (10000 * 2 ** ((i - 90) / 10)),
  # which is display labelling. Band 0 = 20 Hz, 60 = 1280, 90 = 10240, 99 = 19108.52.
  band_hz: [
    20, 21.44, 22.97, 24.62, 26.39, 28.28, 30.31, 32.49, 34.82, 37.32,
    40, 42.87, 45.95, 49.25, 52.78, 56.57, 60.63, 64.98, 69.64, 74.64,
    80, 85.74, 91.9, 98.49, 105.56, 113.14, 121.26, 129.96, 139.29, 149.29,
    160, 171.48, 183.79, 196.98, 211.12, 226.27, 242.51, 259.92, 278.58, 298.57,
    320, 342.97, 367.58, 393.97, 422.24, 452.55, 485.03, 519.84, 557.15, 597.14,
    640, 685.94, 735.17, 787.93, 844.49, 905.1, 970.06, 1039.68, 1114.3, 1194.28,
    1280, 1371.87, 1470.33, 1575.86, 1688.97, 1810.19, 1940.12, 2079.37, 2228.61, 2388.56,
    2560, 2743.74, 2940.67, 3151.73, 3377.94, 3620.39, 3880.23, 4158.73, 4457.22, 4777.13,
    5120, 5487.48, 5881.34, 6303.46, 6755.88, 7240.77, 7760.47, 8317.46, 8914.44, 9554.26,
    10240, 10974.96, 11762.67, 12606.92, 13511.76, 14481.55, 15520.94, 16634.93, 17828.88, 19108.52]
  source_param: "/-prefs/rta/source"     # enum rta_source: 0 none, 1 Monitor, 2-33 Ch, 34-41 Aux, 42-49 FX, 50-65 Bus, 66-71 Mtx, 72 Main, 73 Mono
  pos_param: "/-prefs/rta/pos"           # 0 PRE, 1 POST
  options_param: "/-prefs/rta/options"   # bit 5 = Solo Priority (clear it); bits 0-4 only affect EQ/GEQ overlay views
  stat_param: "/-stat/rtasource"         # read-back: 0-72 pre-EQ, +98 post-EQ (Bus N post = 146+N-1, Main LR post = 168)
  # The analyser behind /meters/15 is not running after a power-up until the console has shown its METERS/RTA page once; the
  # stream is then one static flat frame (-97.0 everywhere). wake_rta_analyser() shows that page for a moment at arm and restores
  # the screen (measured 2026-09-25, meters.md Verification log item 1).
  screen_param: "/-stat/screen/screen"
  meter_page_param: "/-stat/screen/METER/page"
  meters_screen: 1                       # screen index of METERS
  rta_page: 4                            # METERS tab index of RTA
  # Both MUST be forced before arming the detector (found at M7, 2026-09-20):
  # auto-gain normalises the whole display, so every band drifts together when the overall level
  # moves and the detector reads that as the growth signature of feedback; RMS blunts a narrow tone.
  autogain_param: "/-prefs/rta/autogain" # 0/1 - the detector needs absolute levels, so force 0
  det_param: "/-prefs/rta/det"           # raw 0 PEAK, raw 1 RMS (enum rta_det) - force PEAK, feedback is a narrow tone
  # The analyser's ballistics are display preferences too, and just as able to fool the detector: a long
  # release ("decay", 0.25..16 log, raw 0.0 = shortest) makes every note linger after it stops, and peak-hold
  # freezes past maxima into dead-flat prominent bands that look exactly like an established ring.
  decay_param: "/-prefs/rta/decay"       # force raw 0.0 (shortest release)
  peakhold_param: "/-prefs/rta/peakhold" # enum OFF,1..8 - force 0 (OFF)
  gain_param: "/-prefs/rta/gain"         # manual display gain 0..60 dB (effect on /meters/15 UNCONFIRMED; same stage as auto-gain)
  gain_db: 0                             # pinned to this for the session so absolute levels mean the same thing on every desk
  frame_period_s: 0.05

geq:
  fx_types_dual: [GEQ2, TEQ2]   # dual-mono: par 1-31 = side A bands, 32 = master A, 33-63 = side B bands, 64 = master B (fx_routing_scenes.md §2)
  fx_types_stereo: [GEQ, TEQ]   # par 1-31 bands, 32 master
  # ISO 1/3-octave centres, par 1 -> 31 ascending (fx_routing_scenes.md §2.3, corroborated by the /-stat/geqpos example)
  band_hz: [20, 25, 31.5, 40, 50, 63, 80, 100, 125, 160, 200, 250, 315, 400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300, 8000, 10000, 12500, 16000, 20000]
  par_a_first: 1
  par_a_master: 32
  par_b_first: 33
  par_b_master: 64
  gain_scale: geq_gain          # linf -15..+15 dB (0.5 dB grid -> 61 steps)
  insert_slots_preferred: [5, 6, 7, 8]   # fx 5-8 are insert-only; NOTE fx 5-8 use a DIFFERENT type enum (fx_type_58: GEQ2 = 0) from fx 1-4 (fx_type_14: GEQ2 = 27)
  insert_sel_enum: insert_sel   # 0 OFF, 1 FX1L, 2 FX1R, … 16 FX8R, 17-22 AUX1-6 (23 entries)

detector:
  # ---------------------------------------------------------------------------------------------------------------
  # CFS² feedback discriminator — explicit physical predicates (docs/DETECTOR.md, src/x32mcp/detector.py).
  # A tracked spectral LINE is
  #   BASE   = NARROW (P1) ∧ NO-FAMILY (P2) ∧ STABLE (P3) ∧ SUSTAINED (P4) ∧ NEW-or-AT-ARM (P5) ∧ IN-WINDOW (P6) ∧ not frozen
  #   STRONG = BASE ∧ one piece of positive evidence: RISE (own rise >= 6 dB after the band settled) | FAST-RISE (>= 3
  #            watched increments into the plateau) | LOUD (clip flag, or >= max(-10, arm p95 + 20) and 6 dB above all
  #            else) | AT-ARM (established when we armed) | PROBE (over-responds to ring_out's own +1 dB steps twice)
  #   MODERATE = BASE only: published in det.candidates (cfs tier B), never cut by the detector itself.
  # Every key below equals the DetectorConfig default (tests/test_detector.py asserts it); keys absent take the default.
  # ---------------------------------------------------------------------------------------------------------------
  # P1 NARROW / qualification / tracking
  prominence_db: 12            # cluster prominence (line power over the median of the bands ±2..±4 beyond it) to qualify
  neighbour_bins: 3            # bands each side for the single-band prominence median
  track_prominence_db: 6       # a local max this prominent is a *line*: tracked (history starts) but not yet judged
  narrow_db: 8                 # peak - max(level at ±2 outside the line's 1-2-band cluster); humps/washes read ~0-6
  cluster_merge_db: 6          # a neighbour within this of the peak is the same line (tone between two centres = -3/-3)
  track_match_bands: 0.6       # a line continues the track whose centroid is within this (a ring moves < 0.05/frame)
  coast_frames: 8              # a track survives this many frames without its line (cymbal/hat masking)
  track_young_penalty: 0.3     # matching cost added for tracks younger than K1 (established tracks win ties)
  # P2 NO HARMONIC FAMILY (single frame, presence-as-peak, partials at +10 / +15.85 / +20 / +23.2 bands)
  partial_prominence_db: 6     # a partial is present when it is itself a local peak this prominent ...
  partial_tol_bands: 0.6       # ... within ± this of centroid + offset ...
  partial_rel_db: 18           # ... and within 18 dB of the candidate's LEVEL (instrument partials run 0..-15 dB re H1)
  family_window_frames: 20     # the veto fraction is taken over the last this-many matched frames
  cogrowth_lines: 2            # >= 2 OTHER lines born with me and swelling at 0.5-2x my rate on consecutive frames = one
  cogrowth_rise_db: 3          #   swelling source (pad / organ swell / fade-in), not a loop; never on an emitted line
  cogrowth_coborn_frames: 4    #   'born with me' = run starts within max(this, 6 dB / my rate) frames
  cogrowth_window_frames: 20   #   swell = rise over the last this-many frames, net of common mode, still rising
  family_min_partials: 2       # >= this many of H2..H5 present => the frame is family-vetoed
  family_veto_fraction: 0.4    # family on >= 40 % of the last 20 frames (or most of the last 5) => MUSICAL
  late_partials_rise_db: 12    # a family that first appears after the line rose this much is distortion (amp clip)
  h2_pair_rel_db: 12           # a lone exact H2 within this of H1, born with it, is a family (8'+4' organ)
  co_onset_frames: 2           # 'born together' = track births within this many frames
  subharm_hi_margin_db: 3      # a line is somebody's H4/H5 only if that somebody is >= 3 dB louder (speech formants)
  harm_over_base_max_db: 12    # ... and nobody's H2/H3 if it is > 12 dB above them (partials <= ~+10 dB re H1)
  comove_tol_db: 3             # partials co-move with the line (level change over K1 frames within this)
  independent_swing_db: 8      # a would-be partial that APPEARED (>= this over its band baseline) after the line, while
  independent_hold_db: 3       #   the line held within independent_hold_db, is an independent source, not family
  pitch_still_bands: 0.1       # one line dead still (<= this over K1) and a clear one moving >= pitch_moving_bands do not
  pitch_moving_bands: 0.3      #   share a pitch modulation: not one source's partials
  # P3 STABLE / P4 SUSTAINED / common mode
  stable_frames: 5             # K1: 250 ms of centroid within ±centroid_tol_bands (binding latency term)
  confirm_frames: 12           # K2: ring_out MODERATE confirmation; frozen-line hold
  centroid_tol_bands: 0.25     # ±30 cents; vibrato >= ±30 c on an edge, scoops, glides fail; a ring's sd < 0.05 band
  drift_max_bands: 1.0         # a line that walked > 1 band within drift_window_frames is re-born as a new track
  drift_window_frames: 10
  decay_db_per_s: 3            # falling faster than this by >= decay_drop_db => decaying (plucked/struck note, the RTA
  decay_drop_db: 1.5           #   release of a killed ring: no re-emission, no wasted deepening)
  decay_window_frames: 12
  sag_db: 4                    # more than this under the recent max => not sustained
  common_mode_db: 6            # |Δref| >= this over K2 with the line following within common_mode_tol_db => rides a fader
  common_mode_tol_db: 2
  ref_band_lo: 25              # common-mode reference: MEDIAN change of the signal-carrying bands 25..85 (above the frame
  ref_band_hi: 85              #   floor quantile + ref_signal_db), outside the line's own neighbourhood
  ref_floor_quantile: 0.1
  ref_signal_db: 6
  ref_min_bands: 6             # fewer signal bands: fall back to every band >= floor + 3 (quiet ring_out room)
  cm_deadband_db: 2            # rises are net of common-mode moves beyond this (a mix breathes ±1-2 dB; a shove is larger)
  cm_smooth_frames: 3          # common mode measured between 3-frame mean spectra (halves the estimate's jitter)
  # P5 NEW ENERGY / AT-ARM (per-band slow low-percentile baseline seeded at arm; no absolute min_level_db gate)
  baseline_excess_db: 10
  baseline_seed_s: 1.0
  arm_frames: 3                # a line present in the first 3 frames was 'already there' (cannot be new) ...
  arm_line_min_level_db: -40   # ... it carries AT-ARM evidence iff >= this level and >= strong_prominence_db over its first
  arm_fast_level_db: -20       #   K1 frames; emitted at K1 if >= -20 dBFS, otherwise once it outlasted a note (arm_confirm_s;
  arm_confirm_s: 0.8           #   a family-less NOTE sounding at arm is identical until it ends) — single-room guesses, DETECTOR.md
  arm_range_frames: 16         # ... only while steady (range <= arm_range_db over 16 frames) and present >= arm_presence of
  arm_range_db: 6              #   the frames since arm (a kick/bass pattern present at arm pumps and re-triggers)
  arm_presence: 0.8
  arm_family_life_max: 0.2     # AT-ARM needs a family-free life (vetoed on <= 20 % of its frames; at-arm rings measure 0 %, a note ~90 %)
  arm_cohort_rel_db: 12        # >= cogrowth_lines OTHER family-less at-arm lines within this of mine = a chord, not howls
  # P6 FREQUENCY WINDOW (session prior; cfs derives the low edge from the open mics' HPF: ~0.7 x f_hpf -> lf_edge_hz)
  window_low_hz_watch: 160     # programme present: vocal-mic loops do not ring below ~150 Hz (SM58 far field, HPF)
  window_low_hz_ringout: 63    # no programme by contract: wide
  window_low_hz_lf: 40         # when lf_feedback_possible (kick/tom/bass-cab/acoustic pickup near subs)
  window_high_hz: 12500        # condensers/headsets ring to 10-12 kHz; SM58 dies above ~10 kHz
  lf_feedback_possible: false  # operator declaration (constructor override)
  lf_edge_hz: null             # explicit low edge (constructor override); overrides the three defaults when set
  # EVIDENCE
  strong_prominence_db: 18     # AT-ARM needs this median prominence (below ~20 dB 'no family' says nothing: partials may be buried)
  rise_db: 6                   # RISE: observed rise (net of common mode) since the band settled: a doubling of amplitude,
                               #   >= 1 dB above the largest non-swell programme excursion measured on both corpora (4.9-5.1)
  onset_step_db: 4             # a >4 dB single-frame jump out of a line that was not climbing is an onset landing on
  onset_flat_db: 1.0           #   the track (re-struck note, syllable): the presence run restarts; also after > K1
  lf_onset_step_db: 6          #   missed frames. LF: > 6 dB over one settle window out of a window that moved < 2 dB,
  lf_onset_flat_db: 2          #   or a fall of restart_drop_db under the run maximum (re-excited room mode)
  onset_rising_db_per_s: 10    # 'already climbing' = last settled samples rise >= this with residual <= onset_rising_resid_db
  onset_rising_resid_db: 0.75
  rise_quantile: 0.2           # RISE reference = this quantile of the run's last rise_window_frames settled levels, kept as an
  rise_window_frames: 64       #   age-unbounded low-water mark once rise_ref_min_samples exist (a 1-2 dB/s creep adds up),
  rise_ref_min_samples: 8      #   re-anchored if the centroid moves > ±2 centroid_tol_bands; reset when the run restarts
  restart_drop_db: 6
  growth_frames: 8             # GROWTH early upgrade (clean dB-linear climb >= growth_min_db_per_s, residual <= growth_resid_db,
  growth_min_db_per_s: 10      #   >= growth_rise_db): OFF because growth_rise_db == rise_db (4 fired on a pad partial on a
  growth_resid_db: 1.0         #   hold-out seed)
  growth_rise_db: 6
  analyser_rise_k: 1.0         # band settle time = 1.5·k/Δf (uncertainty bound, twice the simulator's tau_a): rises inside it
                               #   are never scored (1 frame above 300 Hz, 4 at 100 Hz, 11 at 40 Hz) -> the M7 40/80 Hz mechanism
  fast_rise_db: 15             # FAST-RISE: >= fast_rise_min_steps consecutive increments each >= fast_rise_step_db (incl. the band's
  fast_rise_step_db: 2         #   pre-birth climb from the spectrum store) summing to >= 15 dB net of common mode, no increment
  fast_rise_min_steps: 3       #   carrying > fast_rise_max_share of it (an instrument attack is 1-2 increments); LF: an unbroken
  fast_rise_max_share: 0.55    #   run longer than the band's settle window + 2
  loudish_level_db: -20        # the LOUD-ISH line = max(this, arm p95 + loudish_above_arm_db): tier B's level, 10 dB under LOUD's on both
  loudish_above_arm_db: 10     #   legs. FAST-RISE counts the step out of the bed (an inferred increment) toward fast_rise_min_steps only for a
                               #   line that reached it (two OBSERVED increments alone are also a soft/breath attack, 100-250 ms); a cut whose
                               #   line HOLDS is deepened only for a loud-ish line cut on plateau-class evidence (see cut_verify_s)
  backfill_frames: 12          # how far back a newborn track looks for its band's own visible climb (>= bed + backfill_floor_margin_db)
  backfill_floor_margin_db: 3
  loud_line_db: -10            # LOUD: peak >= max(this, min(arm-time p95 + loud_above_arm_db, loud_ceiling_db)) AND >= loud_margin_db
  loud_above_arm_db: 20        #   above every band outside its neighbourhood (+20: more than a sine source's ~18 dB concentration gain
  loud_ceiling_db: -6          #   above the show's loudest programme bands; the bar stops rising within 6 dB of full scale: a steady
  arm_baseline_s: 2.0          #   line there dominating the frame is at an electronic limit or a deliberate solo tone, never a mix
  loud_margin_db: 6            #   balance); p95 taken over the first arm_baseline_s; below 160 Hz only the clip flag
  clip_db: -1                  # the analyser clip flag (0.0 dBFS = 'clipping occurred', meters.md §4.2)
  hot_spectrum_p95_db: -20     # HOT_SPECTRUM (flag): arm p95 >= this and p90 >= this - 6, or >= 3 bands clipping across more than one
  hot_hold_s: 5.0              #   cluster (held hot_hold_s): display gain offset / slammed bus. While up the clip flag is not LOUD evidence
  loud_hot_over_max_db: 3      #   and LOUD's level legs also need the line >= loudest arm-window cell + loud_hot_over_max_db
  frozen_frames: 5             # peak bit-identical over K1 frames (4 of 4 steps) = frozen display value (peak-hold): no evidence for K2
  peak_hold_bands: 15          # >= 15 signal bands unchanged >= peak_hold_frames => flag PEAK_HOLD_SUSPECTED (cfs re-forces prefs)
  peak_hold_frames: 10
  slow_release_db_per_s: 30    # measured display release (20 x max single-frame fall) below this => flag SLOW_RELEASE; growth evidence
                               #   then needs >= strong_prominence_db (cfs re-forces /-prefs/rta/decay 0.25)
  reemit_rise_db: 3.0          # re-emission (deepen) only on regrowth >= this above the emitted level, LOUD still (line did not come down),
                               #   a new probe hit, or a 'held'/'insufficient' note_cut() verdict on a loud-ish line cut on plateau-class evidence
  cut_confirm_extra_db: 3      # note_cut(): drop >= bell + this (or the CUT line collapses within cut_settle_s + cut_response_s) => 'confirmed'
  cut_false_tol_db: 1.0        #   drop = bell ± this, flat, still there at cut_verify_s => 'held' (note through the EQ, or limiter-held howl
  cut_verify_s: 1.5            #   with e > cut: deepened once per verdict iff loud-ish and cut on FAST-RISE/LOUD/PROBE/AT-ARM); the line ends by
  held_deepen_excess_db: 20.0
  cut_settle_s: 0.15           #   itself after the response window => 'false_cut' (never re-emitted); drop < bell - tol after the response
  cut_response_s: 0.3          #   window => 'insufficient' (bell = RBJ peaking-cut attenuation at the line's offset, Q geq_q_min..geq_q_max)
  geq_q_min: 2.0               # X32 GEQ bell Q UNCERTAIN: proportional-Q graphic ~2 .. true 1/3 octave 4.3 (loop brief §4.1)
  geq_q_max: 4.3
  programme_window_s: 2.0      # programme_present() (flag PROGRAMME_PRESENT, ring_out contract check): >= programme_min_events note
  programme_min_events: 3      #   events, >= programme_min_transients broadband transients (>= programme_transient_fraction of the
  programme_min_transients: 2  #   fast bands up >= 6 dB in one frame) or mean occupancy >= programme_occupancy qualified non-at-arm
  programme_transient_fraction: 0.25  # lines over the window; a quiet room / hum / whine / established howl give none
  programme_occupancy: 1.0
  # ring_out active probe (cfs calls note_gain_step after each master step)
  probe_over_db: 2             # response >= step + 2 dB while the reference moved <= step + 0.5 => over-response (HIT)
  probe_settle_s: 0.15         # ignore this long after the step (write latency; LF bands lag)
  probe_window_s: 1.4          # judged within this after the step (< ringout.dwell_ms)
  probe_early_hits: 2          # ring_out: two HITs on a still sub-threshold line => pre-emptive (PROBE) emission
  probe_min_hits: 2            # two over-responding steps => PROBE evidence; AT-ARM below -20 dBFS waits for 2 judged steps
  probe_steady_db: 3           # the line must be steady (range <= this) before a step to be judged on it
  probe_pinned_fraction: 0.35  # response < 0.35·step = PINNED (electrical, or a plateau held downstream of the tap): not STATIONARY;
                               #   0.35·step..step+1 = FOLLOWS (room source through the mic): STATIONARY, never cut
  mode: watch                  # default construction mode; cfs passes ringout for ring_out sessions
  ringout_emit_moderate: false # emit BASE-only lines after K2 when no step could test them: only in a verified programme-free
                               #   room (226 FP on the music corpus when true)
  # emission / planner (unchanged semantics)
  confidence_threshold: 0.7    # display contract: emitted detections report confidence >= this (monotone in the margins)
  band_tolerance: 1            # cooldown radius (RTA bands)
  cooldown_s: 1.0              # minimum time between emissions of one line
  notch_step_db: -3
  notch_max_db: -9
  notch_budget_default: 6
  merge_adjacent_bands: 1
  decay_verify_db: 6           # cfs VERIFY: ring must drop >= this within decay_verify_s after a notch
  decay_verify_s: 1.5
  decay_verify_frames: 2       # consecutive frames that must show the drop (one dip is RTA noise)
  frame_period_s: 0.05
  level_gate_db: -128          # optional absolute level gate: OFF (P5's per-band baseline replaces min_level_db)
  # ---------------------------------------------------------------------------------------------------------------
  # LEGACY keys (loaded, NOT used by the decision). The weighted sum 0.3·prominence + 0.2·persistence + 0.5·growth
  # made a plateaued howl unreachable (0.5 < 0.7: M7, 60 dB line at 0.50 for 15 s) and its 6..60 dB/s growth window
  # is exactly what a 1/10-octave band's own step response manufactures at 40-160 Hz from any bass onset (M7's
  # 40/80 Hz cuts); min_level_db -45 was one room's music floor. See docs/DETECTOR.md.
  # ---------------------------------------------------------------------------------------------------------------
  min_level_db: -45
  persistence_frames: 3
  growth_ref_db_per_s: 20
  growth_max_db_per_s: 60
  monotonic_tolerance_db: 1.0
  weights: {prominence: 0.3, persistence: 0.2, growth: 0.5}
  growth_window_frames: 60
  override_prominence_db: 25
  override_persistence_frames: 6

ringout:
  step_db: 1.0
  dwell_ms: 1500
  # Bounds on what a caller may ask for. A ring needs the detector's persistence window (~5 frames,
  # 250 ms) to declare itself; raising faster than that walks the master several dB past threshold
  # before anything can be cut (on a wedge 1 dB of excess is already ~200 dB/s of growth). Humans ring
  # out in 1-3 dB steps for the same reason. dwell below the floor is raised to it (and reported);
  # a larger step is refused.
  max_step_db: 3.0
  min_dwell_ms: 250
  safety_margin_db: 3
  abort_backoff_db: 6
  master_ceiling_db: 0
  start_warn_db: -10         # warn if bus master starts above this

mics:
  send_floor_db: -40
  # An open mic hears the room: with typical gain a live vocal mic idles at -70..-55 dBFS, an input with nothing
  # plugged in reads the preamp floor (DOC: ~-100). Below this a candidate is flagged "no input signal" (not excluded).
  signal_floor_db: -80
  mute_group_convention: 6

# CFS² policy layer (docs/CFS_POLICY.md, src/x32mcp/cfs_policy.py + cfs.py): what the session manager does with the detector's
# hooks -- the MODERATE candidates it will not cut (tier B), the verdict filed after every cut, the analyser flags and the
# ring-out contract check. Every key equals the CfsPolicyConfig default (tests/test_cfs_policy.py asserts it both ways).
cfs_policy:
  # LF edge of the feedback window from the open mics' high-pass filters (REVIEW_REPORT §1.7 Q3): per included mic
  # edge = hpf_factor x HPF corner (HPF on) else no_hpf_hz; session edge = max(floor_hz, min over mics) -> detector lf_edge_hz
  lf_edge:
    hpf_factor: 0.7
    no_hpf_hz: 100.0
    floor_hz: 60.0
  programme_check_s: 5.0                    # G8: programme_present() evaluated over the first >= 5 s of frames (and on any later rise)
  refresh_arm_reference_on_programme: true  # watch armed in silence, programme starts later: re-open the detector's 2 s level reference
  # Tier B: ONE -3 dB cut on a MODERATE line (BASE, no evidence) that is loud-ish (>= det.loudish_threshold_db) or >= min_excess_db
  # over its band's baseline and >= min_age_s old; then the detector's verdict drives the rest: confirmed -> done; false_cut (the
  # line ended by itself) -> ignore-listed, never written shallower; held (dropped by the bell, still there: a note through the EQ
  # OR a limiter/compressor-held howl) -> alert, and if still a held family-less BASE line after held_deepen_s -> -6, then -9;
  # insufficient -> one immediate deepen; ambiguous -> report only. Every action is tagged tier "B" in the notch log / events.
  tier_b:
    enabled: true
    min_excess_db: 20.0
    min_age_s: 0.6
    cooldown_s: 2.0
    held_deepen_s: 3.0
    verdict_timeout_s: 4.0
    ringout_probe_wait_dwells: 2.0          # ring_out: a line the probe has not judged (steps_seen < 2) waits unless loud-ish AND MODERATE this long
    ringout_hold_raise: true                # ring_out: the master is not raised while a tier-B engagement is unresolved
    ended_drop_db: 6.0                      # a held line whose track was lost ENDED (ignore-list) only if its band fell this far; else masked
  # Alerts that reach the desk: cfs.candidate on/off events for MODERATE / held / stationary(backoff_advised) / at-arm lines, and the
  # bus scribble strip turned `color` while any is live (restored clear_s after the last one, always at stop / abort / panic)
  alerts:
    events: true
    scribble_strip: true
    color: RDi                              # enums.color token (inverted red)
    clear_s: 2.0
    min_write_interval_s: 1.0
    hold_s: 0.5
  at_arm_watch_min_prominence_db: 30.0      # watch: an established-at-arm line is cut only if LOUD or >= this prominent (else alert / tier B)
  reforce_ballistics_on_freeze: true        # PEAK_HOLD_SUSPECTED / FROZEN_LINES mid-session: write decay 0 / peakhold OFF once more ...
  frozen_reforce_s: 1.0                     # ... once the flag has stood this long ...
  frozen_abort_s: 5.0                       # ... and abort if the display still looks frozen this long after (it cannot be rung out)
  # ring_out: a STATIONARY line >= 30 dB prominent ('backoff_advised') gets one back-off probe: master -drop_db for a dwell; a fall
  # of more than min_response_db (regenerative 1/(1-g)) or the line dying = feedback -> cut (reason backoff_probe); ~drop_db = a
  # source in the room -> the level is restored and the line left alone
  backoff_probe:
    enabled: true
    drop_db: 3.0
    min_response_db: 4.5
    settle_s: 0.3
