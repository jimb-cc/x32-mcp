  # ---- aux inputs (§5)
  - {family: auxin, section: "config", fields: [config/name, config/icon, config/color, config/source]}
  - {family: auxin, section: "preamp", fields: [preamp/trim, preamp/invert]}
  - {family: auxin, section: "eq", fields: [eq/on]}
  - {family: auxin, section: "eq/{band}", for: {band: [1, 4]}, fields: ["eq/{band}/type", "eq/{band}/f", "eq/{band}/g", "eq/{band}/q"]}
  - {family: auxin, section: "mix", fields: [mix/on, mix/fader, mix/st, mix/pan, mix/mono, mix/mlevel]}
