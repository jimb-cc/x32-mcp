[project]
name = "x32-mcp"
version = "0.1.0"
description = "MCP server exposing safe, structured OSC control of a Behringer X32 (incl. CFS² feedback ring-out assistant)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jim" }]
dependencies = [
    "mcp>=2.2,<3",  # server.py imports mcp.server.mcpserver: 2.x only (mcp 1.x ships fastmcp)
    "pyyaml>=6.0",
    "websockets>=17,<18",
]

[project.scripts]
x32-mcp = "x32mcp.server:main"
x32-fakedesk = "x32mcp.fakedesk:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x32mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 60
addopts = "-ra"

[tool.uv]
package = true
